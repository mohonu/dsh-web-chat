# dsh-webchat bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate by adding this package to the web
# profile's `dsh.profile.bundles` (or via `dsh plugin --profile web add link:...`).
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (DeepSeek web browser engine, /api/dsh-webchat routes,
# agent tools), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at /plugins/<id>/client.js) load
# in the web GUI.
- insert:
    - id: webchat
      name: 'dsh-webchat'
